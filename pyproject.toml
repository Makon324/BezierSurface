[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "Cython>=3.0",
    "numpy>=1.21"
]
build-backend = "setuptools.build_meta"

[project]
name = "bezier-surface-renderer"
version = "0.1.0"
description = "A Bézier surface renderer application using Cython, NumPy, Pillow, and Tkinter for 3D visualization and lighting effects."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.21",
    "Pillow>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["tests*"]
